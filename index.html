<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Modo claro">
    <span id="theme-label">OSCURO</span>
    <span class="theme-track"><span class="theme-thumb"></span></span>
  </button>

  <div class="wrapper">
    <h1 class="site-title" aria-label="TETRIS">
      <span style="--i:0" aria-hidden="true">T</span><span style="--i:1" aria-hidden="true">E</span><span style="--i:2" aria-hidden="true">T</span><span style="--i:3" aria-hidden="true">R</span><span style="--i:4" aria-hidden="true">I</span><span style="--i:5" aria-hidden="true">S</span>
    </h1>

    <div class="stage">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">ENERGÍA <kbd>Q</kbd></span>
          <div id="energy-bar">
            <div class="energy-seg"></div>
            <div class="energy-seg"></div>
            <div class="energy-seg"></div>
            <div class="energy-seg"></div>
            <div class="energy-seg"></div>
          </div>
          <span id="energy-hint" class="energy-hint hidden">PRESIONA Q</span>
        </div>

        <div class="panel-section" id="hold-section" style="display:none">
          <span class="label">HOLD <kbd>C</kbd></span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section" id="challenge-hud" style="display:none">
          <span class="label">DESAFÍO</span>
          <span id="challenge-hud-value" class="challenge-hud-value">...</span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>⇧</kbd> hold</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>Q</kbd> habilidad</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="challenge-select" class="overlay">
      <div class="overlay-box">
        <p class="csel-title">MODO DE JUEGO</p>
        <div id="challenge-list">
          <button class="challenge-btn" data-id="classic" style="--mc:#7aa2f7">
            <span class="cb-icon">🎮</span>
            <span class="cb-name">CLÁSICO</span>
            <span class="cb-desc">Sin límites</span>
          </button>
          <button class="challenge-btn" data-id="sprint" style="--mc:#ffd54f">
            <span class="cb-icon">⏱</span>
            <span class="cb-name">SPRINT 40</span>
            <span class="cb-desc">40 líneas en 2 min</span>
          </button>
          <button class="challenge-btn" data-id="garbage" style="--mc:#e57373">
            <span class="cb-icon">🗑</span>
            <span class="cb-name">BASURA</span>
            <span class="cb-desc">Basura sube cada 10s</span>
          </button>
          <button class="challenge-btn" data-id="preset" style="--mc:#ffb74d">
            <span class="cb-icon">🧱</span>
            <span class="cb-name">PRESET</span>
            <span class="cb-desc">Tablero pre-colocado</span>
          </button>
          <button class="challenge-btn" data-id="invisible" style="--mc:#ba68c8">
            <span class="cb-icon">👁</span>
            <span class="cb-name">INVISIBLE</span>
            <span class="cb-desc">Piezas ocultas al bloquearse</span>
          </button>
          <button class="challenge-btn" data-id="mirror" style="--mc:#4dd0e1">
            <span class="cb-icon">🔄</span>
            <span class="cb-name">INVERSO</span>
            <span class="cb-desc">Rotación invertida Lv 5+</span>
          </button>
        </div>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
